# MinClaude - Français
item.minclaude-cobalt.name = Cobalt
item.minclaude-cobalt.description = Un métal bleu et dense, fondu à partir de plomb et de sable. Sert à construire des murs solides.
block.minclaude-cobalt-smelter.name = Fonderie de cobalt
block.minclaude-cobalt-smelter.description = Fond du plomb et du sable en cobalt. Nécessite de l'énergie.
block.minclaude-cobalt-wall.name = Mur en cobalt
block.minclaude-cobalt-wall.description = Un bloc défensif solide, plus résistant que le titane.
block.minclaude-cobalt-wall-large.name = Grand mur en cobalt
block.minclaude-cobalt-wall-large.description = Un bloc défensif solide qui couvre plusieurs cases.

item.minclaude-nickel.name = Nickel
item.minclaude-nickel.description = Un métal argenté et résistant. Sert aux murs, aux foreuses et aux munitions.
item.minclaude-zinc.name = Zinc
item.minclaude-zinc.description = Un métal léger et bleuté, allié au cuivre pour faire du laiton.
item.minclaude-bauxite.name = Bauxite
item.minclaude-bauxite.description = Un minerai rougeâtre, fondu en aluminium.
item.minclaude-aluminum.name = Aluminium
item.minclaude-aluminum.description = Un métal léger fondu à partir de bauxite. Sert aux convoyeurs rapides et aux nœuds électriques.
item.minclaude-brass.name = Laiton
item.minclaude-brass.description = Un alliage de cuivre et de zinc. Munition perforante pour tourelles.
block.minclaude-ore-cobalt.name = Minerai de cobalt
block.minclaude-ore-cobalt.description = Un gisement de cobalt. Nécessite une foreuse de niveau titane.
block.minclaude-ore-nickel.name = Minerai de nickel
block.minclaude-ore-nickel.description = Un gisement de nickel.
block.minclaude-ore-zinc.name = Minerai de zinc
block.minclaude-ore-zinc.description = Un gisement de zinc.
block.minclaude-ore-bauxite.name = Minerai de bauxite
block.minclaude-ore-bauxite.description = Un gisement de bauxite.
block.minclaude-aluminum-smelter.name = Fonderie d'aluminium
block.minclaude-aluminum-smelter.description = Fond la bauxite et le charbon en aluminium. Nécessite de l'énergie.
block.minclaude-brass-foundry.name = Fonderie de laiton
block.minclaude-brass-foundry.description = Allie le cuivre et le zinc en laiton. Nécessite de l'énergie.
block.minclaude-ore-washer.name = Laveur de minerai
block.minclaude-ore-washer.description = Lave le sable à l'eau pour en extraire du nickel, du zinc, de la bauxite et un peu de cobalt.
block.minclaude-percussion-drill.name = Foreuse à percussion
block.minclaude-percussion-drill.description = Une foreuse électrique, plus rapide que la foreuse pneumatique. Extrait le cobalt.
block.minclaude-nickel-wall.name = Mur en nickel
block.minclaude-nickel-wall.description = Un bloc défensif bon marché, plus résistant que le cuivre.
block.minclaude-nickel-wall-large.name = Grand mur en nickel
block.minclaude-nickel-wall-large.description = Un bloc défensif bon marché qui couvre plusieurs cases.
block.minclaude-reinforced-conveyor.name = Convoyeur renforcé
block.minclaude-reinforced-conveyor.description = Un convoyeur en aluminium, plus rapide que le convoyeur en titane.
block.minclaude-rivet.name = Riveteuse
block.minclaude-rivet.description = Une tourelle 2x2 qui tire des balles de métal. Nickel, aluminium (rapide) ou laiton (perforant).
block.minclaude-aluminum-node.name = Nœud en aluminium
block.minclaude-aluminum-node.description = Un nœud électrique bon marché, de plus longue portée.
unit.minclaude-warden.name = Gardien
unit.minclaude-warden.description = Un mécha terrestre robuste à deux canons. Construit dans l'usine terrestre.
unit.minclaude-aid.name = Secours
unit.minclaude-aid.description = Un drone de soutien qui répare les unités proches. Construit dans l'usine aérienne.
unit.minclaude-marauder.name = Maraudeur
unit.minclaude-marauder.description = Un mécha ennemi blindé à canon explosif. Apparaît dans les vagues.
unit.minclaude-wasp.name = Guêpe
unit.minclaude-wasp.description = Un volant ennemi rapide qui vise les générateurs. Apparaît dans les vagues.

item.minclaude-chrome.name = Chrome
item.minclaude-chrome.description = Un métal dur et brillant, extrait de la saumure par électrolyse ou miné. Sert aux machines avancées.
item.minclaude-steel.name = Acier
item.minclaude-steel.description = De la ferraille affinée au charbon. Murs solides, tourelles et alliages.
item.minclaude-invar.name = Invar
item.minclaude-invar.description = Un alliage nickel-acier qui ne se dilate pas à la chaleur. Convoyeurs blindés, conteneurs, munitions lourdes.
liquid.minclaude-brine.name = Saumure
liquid.minclaude-brine.description = De l'eau salée riche en métaux dissous. Électrolysée en chrome.
liquid.minclaude-liquid-nitrogen.name = Azote liquide
liquid.minclaude-liquid-nitrogen.description = Un liquide extrêmement froid. Excellent refroidissant ; gèle les ennemis touchés par la tourelle Givre.
block.minclaude-ore-chrome.name = Minerai de chrome
block.minclaude-ore-chrome.description = Un gisement de chrome. Nécessite une foreuse de niveau titane.
block.minclaude-steel-furnace.name = Four à acier
block.minclaude-steel-furnace.description = Affine la ferraille et le charbon en acier. Nécessite de l'énergie.
block.minclaude-alloy-press.name = Presse à alliage
block.minclaude-alloy-press.description = Presse le nickel et l'acier en invar. Nécessite de l'énergie.
block.minclaude-brine-mixer.name = Mélangeur de saumure
block.minclaude-brine-mixer.description = Dissout du sable dans l'eau pour faire de la saumure. Nécessite de l'énergie.
block.minclaude-cryogenizer.name = Cryogénisateur
block.minclaude-cryogenizer.description = Liquéfie l'azote à partir d'eau et d'aluminium, avec beaucoup d'énergie.
block.minclaude-brine-electrolyzer.name = Électrolyseur
block.minclaude-brine-electrolyzer.description = Extrait le chrome de la saumure. Nécessite beaucoup d'énergie.
block.minclaude-steel-wall.name = Mur en acier
block.minclaude-steel-wall.description = Un mur très résistant qui absorbe les lasers.
block.minclaude-steel-wall-large.name = Grand mur en acier
block.minclaude-steel-wall-large.description = Un mur très résistant qui couvre plusieurs cases. Absorbe les lasers.
block.minclaude-plated-conveyor.name = Convoyeur blindé
block.minclaude-plated-conveyor.description = Un convoyeur blindé rapide. N'accepte que les objets venant d'un convoyeur placé derrière lui.
block.minclaude-volley.name = Salve
block.minclaude-volley.description = Une tourelle-fusil 2x2 qui tire 5 balles à la fois. Acier ou invar (recul).
block.minclaude-frost.name = Givre
block.minclaude-frost.description = Projette des liquides. À l'azote liquide, gèle et ralentit les ennemis.
block.minclaude-invar-container.name = Conteneur en invar
block.minclaude-invar-container.description = Un grand stockage d'objets très solide. Ne fusionne pas avec le noyau.
unit.minclaude-sentinel.name = Sentinelle
unit.minclaude-sentinel.description = Un mécha blindé qui tire en rafales. Amélioré à partir du Gardien dans le reconstructeur additif.
unit.minclaude-bastion.name = Bastion
unit.minclaude-bastion.description = Un mécha lourd à mortier. Amélioré à partir de la Sentinelle dans le reconstructeur multiplicatif.
unit.minclaude-relay.name = Relais
unit.minclaude-relay.description = Un volant de soutien au champ de réparation puissant, qui tire des projectiles soignants. Amélioré à partir du Secours.
unit.minclaude-ravager.name = Ravageur
unit.minclaude-ravager.description = Un mécha ennemi lourdement blindé, armé d'un fusil. Apparaît dans les vagues.
unit.minclaude-hornet.name = Frelon
unit.minclaude-hornet.description = Un bombardier ennemi qui vise les usines et les générateurs. Apparaît dans les vagues.
unit.minclaude-brute.name = Brute
unit.minclaude-brute.description = Un mécha ennemi massif et lent, armé d'un canon de siège. Mini-boss rare.

item.minclaude-duralumin.name = Duralumin
item.minclaude-duralumin.description = Un alliage léger et dur d'aluminium, de cuivre et de chrome. Ponts longs, munitions du canon électrique.
item.minclaude-cermet.name = Cermet
item.minclaude-cermet.description = Un composite céramique-métal, extrêmement résistant à la chaleur. Murs isolés, cristaux quantiques.
item.minclaude-carbon-fiber.name = Fibre de carbone
item.minclaude-carbon-fiber.description = Des fils de graphite tissés, légers et très solides. Constructions de fin de jeu.
item.minclaude-quantum-crystal.name = Cristal quantique
item.minclaude-quantum-crystal.description = Un cristal qui résonne d'énergie de phase. Munition dévastatrice du canon électrique.
liquid.minclaude-sulfuric-acid.name = Acide sulfurique
liquid.minclaude-sulfuric-acid.description = Un réactif corrosif pour la chimie de fin de jeu.
block.minclaude-duralumin-forge.name = Forge à duralumin
block.minclaude-duralumin-forge.description = Allie l'aluminium, le cuivre et le chrome en duralumin.
block.minclaude-acid-plant.name = Usine d'acide
block.minclaude-acid-plant.description = Produit de l'acide sulfurique à partir de pyratite et d'eau.
block.minclaude-cermet-kiln.name = Four à cermet
block.minclaude-cermet-kiln.description = Cuit le silicium, le chrome et le titane avec de l'acide pour faire du cermet.
block.minclaude-carbon-weaver.name = Tisseuse de carbone
block.minclaude-carbon-weaver.description = Tisse le graphite et le plastanium en fibre de carbone, avec de l'acide.
block.minclaude-quantum-resonator.name = Résonateur quantique
block.minclaude-quantum-resonator.description = Fait croître des cristaux quantiques à partir de tissu de phase, de cobalt et de cermet. Nécessite de l'azote liquide et beaucoup d'énergie.
block.minclaude-cermet-wall.name = Mur en cermet
block.minclaude-cermet-wall.description = Le mur le plus résistant. Absorbe les lasers et isole des arcs électriques.
block.minclaude-cermet-wall-large.name = Grand mur en cermet
block.minclaude-cermet-wall-large.description = Le mur le plus résistant, sur plusieurs cases.
block.minclaude-duralumin-bridge.name = Pont en duralumin
block.minclaude-duralumin-bridge.description = Un pont à objets rapide, de plus longue portée.
block.minclaude-railgun.name = Canon électrique
block.minclaude-railgun.description = Un canon électromagnétique 3x3. Transperce les lignes d'ennemis à très longue portée. Duralumin ou cristal quantique ; nécessite de l'énergie.
unit.minclaude-scout.name = Éclaireur
unit.minclaude-scout.description = Une unité terrestre rapide et légère. Construite dans l'usine terrestre.
unit.minclaude-engineer.name = Ingénieur
unit.minclaude-engineer.description = Une unité terrestre qui construit et mine (jusqu'au titane). Construite dans l'usine terrestre.
unit.minclaude-citadel.name = Citadelle
unit.minclaude-citadel.description = Un mécha de siège T4 à canon d'artillerie lourde. Amélioré à partir du Bastion.
unit.minclaude-colossus.name = Colosse
unit.minclaude-colossus.description = Une forteresse ambulante T5. Améliorée à partir de la Citadelle.
unit.minclaude-beacon.name = Balise
unit.minclaude-beacon.description = Un volant de soutien T3 au champ de réparation puissant. Amélioré à partir du Relais.
unit.minclaude-sanctum.name = Sanctuaire
unit.minclaude-sanctum.description = Un volant de soutien T4 qui projette un bouclier et répare les alliés. Amélioré à partir de la Balise.
unit.minclaude-halo.name = Halo
unit.minclaude-halo.description = Un sanctuaire volant T5 au bouclier immense. Amélioré à partir du Sanctuaire.
unit.minclaude-skiff.name = Esquif
unit.minclaude-skiff.description = Une unité navale légère. Construite dans l'usine navale.
unit.minclaude-corvette.name = Corvette
unit.minclaude-corvette.description = Une canonnière navale T2. Améliorée à partir de l'Esquif.
unit.minclaude-frigate.name = Frégate
unit.minclaude-frigate.description = Un navire d'artillerie T3. Amélioré à partir de la Corvette.
unit.minclaude-swarmling.name = Essaimeur
unit.minclaude-swarmling.description = Un petit ennemi rapide qui arrive en grand nombre.
unit.minclaude-sapper.name = Sapeur
unit.minclaude-sapper.description = Un ennemi spécialisé dans la destruction des bâtiments.
unit.minclaude-siegebreaker.name = Brise-siège
unit.minclaude-siegebreaker.description = Un mécha d'artillerie ennemi qui pilonne les défenses de loin.
unit.minclaude-shocker.name = Électrocuteur
unit.minclaude-shocker.description = Un mécha ennemi qui lance des arcs électriques.
unit.minclaude-juggernaut.name = Mastodonte
unit.minclaude-juggernaut.description = Un mécha-char ennemi lent et protégé par un bouclier.
unit.minclaude-stalker.name = Traqueur
unit.minclaude-stalker.description = Un ennemi rapide qui fonce au contact avec un fusil.
unit.minclaude-phantom.name = Fantôme
unit.minclaude-phantom.description = Un volant ennemi très rapide et fragile.
unit.minclaude-gunship.name = Cannonière
unit.minclaude-gunship.description = Un volant ennemi blindé aux canons à tir rapide.
unit.minclaude-dreadwing.name = Aile-terreur
unit.minclaude-dreadwing.description = Un bombardier ennemi lourd.
unit.minclaude-warlord.name = Seigneur de guerre
unit.minclaude-warlord.description = BOSS. Un mécha ennemi colossal, armé d'artillerie et d'éclairs.
unit.minclaude-leviathan.name = Léviathan
unit.minclaude-leviathan.description = BOSS. Une forteresse volante ennemie colossale.

