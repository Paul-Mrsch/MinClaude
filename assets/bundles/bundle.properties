# MinClaude - English (default)
item.minclaude-cobalt.name = Cobalt
item.minclaude-cobalt.description = A dense blue metal smelted from lead and sand. Used in sturdy walls.
block.minclaude-cobalt-smelter.name = Cobalt Smelter
block.minclaude-cobalt-smelter.description = Smelts lead and sand into cobalt. Requires power.
block.minclaude-cobalt-wall.name = Cobalt Wall
block.minclaude-cobalt-wall.description = A sturdy defensive block, tougher than titanium.
block.minclaude-cobalt-wall-large.name = Large Cobalt Wall
block.minclaude-cobalt-wall-large.description = A sturdy defensive block spanning multiple tiles.

item.minclaude-nickel.name = Nickel
item.minclaude-nickel.description = A tough silvery metal. Used in walls, drills and turret ammo.
item.minclaude-zinc.name = Zinc
item.minclaude-zinc.description = A light bluish metal, alloyed with copper into brass.
item.minclaude-bauxite.name = Bauxite
item.minclaude-bauxite.description = A reddish ore, smelted into aluminum.
item.minclaude-aluminum.name = Aluminum
item.minclaude-aluminum.description = A light metal smelted from bauxite. Used in fast conveyors and power nodes.
item.minclaude-brass.name = Brass
item.minclaude-brass.description = A copper and zinc alloy. Piercing turret ammunition.
block.minclaude-ore-cobalt.name = Cobalt Ore
block.minclaude-ore-cobalt.description = A cobalt deposit. Requires a titanium-tier drill.
block.minclaude-ore-nickel.name = Nickel Ore
block.minclaude-ore-nickel.description = A nickel deposit.
block.minclaude-ore-zinc.name = Zinc Ore
block.minclaude-ore-zinc.description = A zinc deposit.
block.minclaude-ore-bauxite.name = Bauxite Ore
block.minclaude-ore-bauxite.description = A bauxite deposit.
block.minclaude-aluminum-smelter.name = Aluminum Smelter
block.minclaude-aluminum-smelter.description = Smelts bauxite and coal into aluminum. Requires power.
block.minclaude-brass-foundry.name = Brass Foundry
block.minclaude-brass-foundry.description = Alloys copper and zinc into brass. Requires power.
block.minclaude-ore-washer.name = Ore Washer
block.minclaude-ore-washer.description = Washes sand with water to extract nickel, zinc, bauxite and a little cobalt.
block.minclaude-percussion-drill.name = Percussion Drill
block.minclaude-percussion-drill.description = A powered drill, faster than the pneumatic drill. Mines cobalt.
block.minclaude-nickel-wall.name = Nickel Wall
block.minclaude-nickel-wall.description = A cheap defensive block, tougher than copper.
block.minclaude-nickel-wall-large.name = Large Nickel Wall
block.minclaude-nickel-wall-large.description = A cheap defensive block spanning multiple tiles.
block.minclaude-reinforced-conveyor.name = Reinforced Conveyor
block.minclaude-reinforced-conveyor.description = An aluminum conveyor, faster than the titanium conveyor.
block.minclaude-rivet.name = Rivet
block.minclaude-rivet.description = A 2x2 turret firing metal slugs. Nickel, aluminum (fast) or brass (piercing).
block.minclaude-aluminum-node.name = Aluminum Node
block.minclaude-aluminum-node.description = A cheap power node with a longer range.
unit.minclaude-warden.name = Warden
unit.minclaude-warden.description = A sturdy ground mech with twin guns. Built in the ground factory.
unit.minclaude-aid.name = Aid
unit.minclaude-aid.description = A support drone that repairs nearby units. Built in the air factory.
unit.minclaude-marauder.name = Marauder
unit.minclaude-marauder.description = An armored enemy mech with an explosive cannon. Appears in waves.
unit.minclaude-wasp.name = Wasp
unit.minclaude-wasp.description = A fast enemy flyer that targets generators. Appears in waves.

item.minclaude-chrome.name = Chrome
item.minclaude-chrome.description = A hard, shiny metal extracted from brine by electrolysis, or mined. Used in advanced machines.
item.minclaude-steel.name = Steel
item.minclaude-steel.description = Scrap refined with coal. Sturdy walls, turrets and alloys.
item.minclaude-invar.name = Invar
item.minclaude-invar.description = A nickel-steel alloy that does not expand with heat. Armored conveyors, containers, heavy ammo.
liquid.minclaude-brine.name = Brine
liquid.minclaude-brine.description = Salty water rich in dissolved metals. Electrolysed into chrome.
liquid.minclaude-liquid-nitrogen.name = Liquid Nitrogen
liquid.minclaude-liquid-nitrogen.description = An extremely cold liquid. Excellent coolant; freezes enemies hit by the Frost turret.
block.minclaude-ore-chrome.name = Chrome Ore
block.minclaude-ore-chrome.description = A chrome deposit. Requires a titanium-tier drill.
block.minclaude-steel-furnace.name = Steel Furnace
block.minclaude-steel-furnace.description = Refines scrap and coal into steel. Requires power.
block.minclaude-alloy-press.name = Alloy Press
block.minclaude-alloy-press.description = Presses nickel and steel into invar. Requires power.
block.minclaude-brine-mixer.name = Brine Mixer
block.minclaude-brine-mixer.description = Dissolves sand in water to make brine. Requires power.
block.minclaude-cryogenizer.name = Cryogenizer
block.minclaude-cryogenizer.description = Liquefies nitrogen using water, aluminum and a lot of power.
block.minclaude-brine-electrolyzer.name = Electrolyzer
block.minclaude-brine-electrolyzer.description = Extracts chrome from brine. Requires a lot of power.
block.minclaude-steel-wall.name = Steel Wall
block.minclaude-steel-wall.description = A very sturdy wall that absorbs lasers.
block.minclaude-steel-wall-large.name = Large Steel Wall
block.minclaude-steel-wall-large.description = A very sturdy wall spanning multiple tiles. Absorbs lasers.
block.minclaude-plated-conveyor.name = Plated Conveyor
block.minclaude-plated-conveyor.description = A fast armored conveyor. Only accepts items from other conveyors behind it.
block.minclaude-volley.name = Volley
block.minclaude-volley.description = A 2x2 shotgun turret firing 5 slugs at once. Steel or invar (knockback).
block.minclaude-frost.name = Frost
block.minclaude-frost.description = Sprays liquids. With liquid nitrogen, freezes and slows enemies.
block.minclaude-invar-container.name = Invar Container
block.minclaude-invar-container.description = A large, sturdy item storage. Does not merge with the core.
unit.minclaude-sentinel.name = Sentinel
unit.minclaude-sentinel.description = An armored mech firing bursts. Upgraded from the Warden in the additive reconstructor.
unit.minclaude-bastion.name = Bastion
unit.minclaude-bastion.description = A heavy mortar mech. Upgraded from the Sentinel in the multiplicative reconstructor.
unit.minclaude-relay.name = Relay
unit.minclaude-relay.description = A support flyer with a strong repair field and healing bolts. Upgraded from the Aid.
unit.minclaude-ravager.name = Ravager
unit.minclaude-ravager.description = A heavily armored enemy mech with a shotgun. Appears in waves.
unit.minclaude-hornet.name = Hornet
unit.minclaude-hornet.description = An enemy bomber that targets factories and generators. Appears in waves.
unit.minclaude-brute.name = Brute
unit.minclaude-brute.description = A slow, massive enemy mech with a siege cannon. A rare mini-boss.

item.minclaude-duralumin.name = Duralumin
item.minclaude-duralumin.description = A light, hard aluminum-copper-chrome alloy. Long bridges, railgun ammo.
item.minclaude-cermet.name = Cermet
item.minclaude-cermet.description = A ceramic-metal composite, extremely heat resistant. Insulated walls, quantum crystals.
item.minclaude-carbon-fiber.name = Carbon Fiber
item.minclaude-carbon-fiber.description = Woven graphite strands, light and very strong. End-game construction.
item.minclaude-quantum-crystal.name = Quantum Crystal
item.minclaude-quantum-crystal.description = A crystal resonating with phase energy. Devastating railgun ammo.
liquid.minclaude-sulfuric-acid.name = Sulfuric Acid
liquid.minclaude-sulfuric-acid.description = A corrosive reagent for end-game chemistry.
block.minclaude-duralumin-forge.name = Duralumin Forge
block.minclaude-duralumin-forge.description = Alloys aluminum, copper and chrome into duralumin.
block.minclaude-acid-plant.name = Acid Plant
block.minclaude-acid-plant.description = Produces sulfuric acid from pyratite and water.
block.minclaude-cermet-kiln.name = Cermet Kiln
block.minclaude-cermet-kiln.description = Fires silicon, chrome and titanium with acid into cermet.
block.minclaude-carbon-weaver.name = Carbon Weaver
block.minclaude-carbon-weaver.description = Weaves graphite and plastanium into carbon fiber, using acid.
block.minclaude-quantum-resonator.name = Quantum Resonator
block.minclaude-quantum-resonator.description = Grows quantum crystals from phase fabric, cobalt and cermet. Needs liquid nitrogen and a lot of power.
block.minclaude-cermet-wall.name = Cermet Wall
block.minclaude-cermet-wall.description = The toughest wall. Absorbs lasers and is insulated from power arcs.
block.minclaude-cermet-wall-large.name = Large Cermet Wall
block.minclaude-cermet-wall-large.description = The toughest wall, spanning multiple tiles.
block.minclaude-duralumin-bridge.name = Duralumin Bridge
block.minclaude-duralumin-bridge.description = A fast item bridge with a longer range.
block.minclaude-railgun.name = Railgun
block.minclaude-railgun.description = A 3x3 electromagnetic cannon. Pierces lines of enemies at very long range. Duralumin or quantum crystal; needs power.
unit.minclaude-scout.name = Scout
unit.minclaude-scout.description = A fast, light ground unit. Built in the ground factory.
unit.minclaude-engineer.name = Engineer
unit.minclaude-engineer.description = A ground unit that builds and mines (up to titanium). Built in the ground factory.
unit.minclaude-citadel.name = Citadel
unit.minclaude-citadel.description = A T4 siege mech with a heavy artillery cannon. Upgraded from the Bastion.
unit.minclaude-colossus.name = Colossus
unit.minclaude-colossus.description = A T5 walking fortress. Upgraded from the Citadel.
unit.minclaude-beacon.name = Beacon
unit.minclaude-beacon.description = A T3 support flyer with a strong repair field. Upgraded from the Relay.
unit.minclaude-sanctum.name = Sanctum
unit.minclaude-sanctum.description = A T4 support flyer projecting a shield and repairing allies. Upgraded from the Beacon.
unit.minclaude-halo.name = Halo
unit.minclaude-halo.description = A T5 flying sanctuary with a huge shield. Upgraded from the Sanctum.
unit.minclaude-skiff.name = Skiff
unit.minclaude-skiff.description = A light naval unit. Built in the naval factory.
unit.minclaude-corvette.name = Corvette
unit.minclaude-corvette.description = A T2 naval gunboat. Upgraded from the Skiff.
unit.minclaude-frigate.name = Frigate
unit.minclaude-frigate.description = A T3 naval artillery ship. Upgraded from the Corvette.
unit.minclaude-swarmling.name = Swarmling
unit.minclaude-swarmling.description = A tiny, fast enemy that comes in large numbers.
unit.minclaude-sapper.name = Sapper
unit.minclaude-sapper.description = An enemy specialized in destroying buildings.
unit.minclaude-siegebreaker.name = Siegebreaker
unit.minclaude-siegebreaker.description = An enemy artillery mech that shells defenses from afar.
unit.minclaude-shocker.name = Shocker
unit.minclaude-shocker.description = An enemy mech that fires lightning arcs.
unit.minclaude-juggernaut.name = Juggernaut
unit.minclaude-juggernaut.description = A slow, shielded enemy tank-mech.
unit.minclaude-stalker.name = Stalker
unit.minclaude-stalker.description = A fast enemy that closes in with a shotgun.
unit.minclaude-phantom.name = Phantom
unit.minclaude-phantom.description = A very fast, fragile enemy flyer.
unit.minclaude-gunship.name = Gunship
unit.minclaude-gunship.description = An armored enemy flyer with rapid-fire guns.
unit.minclaude-dreadwing.name = Dreadwing
unit.minclaude-dreadwing.description = A heavy enemy bomber.
unit.minclaude-warlord.name = Warlord
unit.minclaude-warlord.description = BOSS. A colossal enemy mech with artillery and lightning.
unit.minclaude-leviathan.name = Leviathan
unit.minclaude-leviathan.description = BOSS. A colossal enemy flying fortress.

